[build-system]
# 77.0.3 is the floor for PEP 639 (`license` as an SPDX expression plus
# `license-files`), which the metadata below uses.
# `wheel` is deliberately absent: modern setuptools builds wheels itself, and
# listing it is a long-standing cargo cult that only pins an extra package.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "robstattm-py"
version = "0.1.0"
description = "Python wrappers for the RobStatTM robust-statistics R package"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: an SPDX expression, not a table, and the licence file listed
# explicitly so it is carried in the distribution metadata. The older
# `{ text = "MIT" }` form and the `License :: OSI Approved ::` classifier are
# both deprecated — setuptools removes them on 2027-02-18 — and package metadata
# cannot be edited after release, so this is fixed before the first publish
# rather than after.
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
    { name = "Aakarsh Gupta", email = "aakarshg@uw.edu" },
]
keywords = ["robust statistics", "rpy2", "RobStatTM", "MM-estimator", "Rocke S-estimator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "rpy2>=3.6",
    "numpy>=1.24",
    "pandas>=2.0",
    # Used by robstattm_py._renv to version-sort R installations. Small,
    # pure-Python, and already present in most scientific environments.
    "packaging>=23",
]

[project.scripts]
robstattm-py = "robstattm_py.cli._main:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "plotnine>=0.13"]
benchmarks = ["scikit-learn>=1.3", "statsmodels>=0.14"]
# Everything needed to execute the example notebooks end-to-end (tests/test_notebooks.py).
# scipy/matplotlib/plotnine are used by the notebooks, not by the package itself,
# so they are intentionally NOT runtime dependencies.
notebooks = [
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotnine>=0.13",
    "nbclient>=0.9",
    "nbformat>=5",
    "ipykernel>=6",
]
# Everything the scripts in examples/ need beyond the package itself. They draw
# the non-robust comparators the book's R scripts plot alongside the robust fit
# (matplotlib for the figures, scipy for the classical F distribution); neither
# belongs in the runtime dependencies.
examples = [
    "matplotlib>=3.7",
    "scipy>=1.10",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff",
    "build",
    "twine",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser>=2",
    "sphinx-design",
    "sphinx-copybutton",
    "jinja2",
    "nbformat",
    "nbconvert",
]

[project.urls]
Homepage = "https://github.com/Aakarsh751/robstattm-py"
Documentation = "https://aakarsh751.github.io/robstattm-py/"
Source = "https://github.com/Aakarsh751/robstattm-py"
Issues = "https://github.com/Aakarsh751/robstattm-py/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robstattm_py*"]

[tool.setuptools.package-data]
"robstattm_py" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >5 seconds",
    "needs_pyinit: skipped if pyinit R package missing",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

# Every entry below is a deliberate exception, not a backlog. `ruff check src
# tests examples` is enforced in CI, so an undocumented violation fails the
# build instead of accumulating.
[tool.ruff.lint.per-file-ignores]
# The flat re-export surface. `__version__` is computed by a function that must
# be defined before it runs, so the wrapper imports necessarily follow code
# (E402); they are grouped by statistical domain rather than alphabetically,
# which is the order the API reference presents them in (I001).
"src/robstattm_py/__init__.py" = ["E402", "I001"]
# This module exists to expose the R spellings — `lmrobdetMM`, `covRobMM`,
# `BYlogreg`. Renaming them to snake_case would delete its reason to exist.
"src/robstattm_py/compat_r.py" = ["N816"]
# Wrapper signatures mirror the R functions they call, so a design matrix is
# `X` and a scatter matrix is `Sigma`. Matching R is the contract (see
# docs/architecture.md); renaming to `x`/`sigma` would turn the mapping from
# the R documentation to these wrappers into guesswork.
"src/robstattm_py/**" = ["N803", "N806"]
# Tests and examples deliberately reuse the book's variable names so a reader
# holding Maronna et al. can follow along line by line.
"tests/**" = ["N802", "N803", "N806", "N816"]
"exploration/**" = ["N802", "N803", "N806", "N816"]
"examples/**" = ["N802", "N803", "N806", "N816"]
