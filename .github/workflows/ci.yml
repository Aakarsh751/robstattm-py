name: CI

# RobStatTM-Py test suite. The package wraps R via rpy2, so CI installs R +
# RobStatTM (and deps) on each runner, then runs the strict-tier pytest suite.
# Slow end-to-end notebook execution is skipped here (RPM_SKIP_NOTEBOOKS=1);
# run `python -m pytest tests/` locally for the full set.
#
# NOTE: this workflow assumes `robstattm-py/` is the repository root. If the
# folder lives inside a larger monorepo, move this file to the repo-root
# `.github/workflows/` and add `defaults.run.working-directory: robstattm-py`
# (plus a matching `working-directory` on the checkout-relative steps).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover all three desktop OSes so the rpy2/R bridge is exercised on each.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # A couple of extra Python versions on Linux (cheapest runner) to
          # guard the >=3.10 floor and a newer interpreter.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # use-public-rspm above configures the correct per-OS binary repo, so we
      # let install.packages() use that default (no hardcoded repos).
      #
      # `robust` is here for its data, not its estimators: the glmrob strict-tier
      # tests fit the Breslow epilepsy data (`breslow.dat`), which ships in
      # `robust` rather than in `robustbase`. It is a core (fatal) dep because
      # those tests are gated on `robustbase`, which is core — without `robust`
      # they would skip rather than run, silently losing the R parity coverage.
      - name: Install core R dependencies
        run: |
          install.packages(c("RobStatTM", "pyinit", "robustbase", "robust", "rrcov"))
        shell: Rscript {0}

      # Backing packages for the external-wrapper tests, installed in a separate,
      # non-fatal step: each such test is gated on a needs_* guard in
      # tests/conftest.py and skips gracefully when its package is absent, so a
      # build failure on these heavier packages must not fail CI — but when they
      # install, their strict-tier parity tests run.
      #
      #   pense, GSE     -> test_pense.py, test_gse.py
      #   robcbi         -> test_cubinf.py
      #   robustarima    -> test_arima_rob.py
      #   robustvarComp  -> test_var_comprob.py  (with WWGbook for the autism data)
      #
      # Note a skip is not a pass: before this list was completed, four external
      # test files skipped on every runner and read as green without ever running.
      - name: Install optional R dependencies (external wrapper backends)
        continue-on-error: true
        run: |
          install.packages(c(
            "pense", "GSE", "robcbi", "robustarima", "robustvarComp", "WWGbook"
          ))
        shell: Rscript {0}

      # Deliberately NOT exporting R_HOME. This job's purpose is now twofold:
      # prove the wrappers work, and prove that R auto-detection finds a
      # system R unaided on each OS. Setting R_HOME would short-circuit the
      # discovery chain and hide a regression in it.

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      # Lint was documented in CONTRIBUTING but never actually enforced, so it
      # had accumulated ~790 findings across the repo — including an undefined
      # name in src/. It is clean now; this keeps it that way. Deliberate
      # exceptions live in pyproject.toml's per-file-ignores with the reason
      # beside each, so a new violation cannot be waved through silently.
      # One runner is enough: ruff's findings are platform-independent.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m ruff check src tests exploration examples

      # `robstattm-py setup` is never run here, so discovery must land on the
      # system R installed above. Asserting the source keeps this job honest:
      # without it, a future provisioning bug could make every job silently
      # test the same code path.
      - name: Verify R auto-detection (no R_HOME set)
        # bash on every runner, Windows included, so one script covers the matrix.
        shell: bash
        run: |
          python -m robstattm_py.cli doctor
          python -m robstattm_py.cli doctor --json > doctor.json
          python dev/_assert_doctor.py doctor.json --expect-source system

      # This includes tests/test_examples.py, which executes all 25 scripts in
      # examples/ end to end on every runner (~2 minutes). Kept on every leg
      # rather than one, because the examples exercise real file paths, console
      # encoding and figure output — the things that differ per OS. An example
      # whose R backend is missing reports a skip naming the package, not a
      # pass, so a failed optional-R install above cannot hide as green.
      - name: Run test suite (notebooks skipped)
        env:
          RPM_SKIP_NOTEBOOKS: "1"
        run: python -m pytest tests/ -q

      # Validate the docs examples are honest: every wrapper page's Python
      # example runs against R, and every docs/examples/*.R override runs under
      # RobStatTM. OS-independent, so run once (cheapest runner / one version).
      - name: Validate doc examples (Python + R)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python docs/scripts/validate_docs.py
