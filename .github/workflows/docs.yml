name: Docs

# Builds the Sphinx site and publishes it to GitHub Pages on every push to main.
# The docs build does NOT import robstattm_py (no autodoc) and is fully R-free, so
# we install only the Sphinx tooling, never the package or rpy2/R.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Sphinx tooling
        run: |
          python -m pip install --upgrade pip
          pip install sphinx furo myst-parser sphinx-design sphinx-copybutton

      - name: Build site (warnings are errors)
        run: python -m sphinx -b html -W docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
