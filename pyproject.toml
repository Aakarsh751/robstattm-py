[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robstattm-py"
version = "0.0.1.dev0"
description = "Python wrappers for the RobStatTM robust-statistics R package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aakarsh Gupta", email = "aakarshg@uw.edu" },
]
keywords = ["robust statistics", "rpy2", "RobStatTM", "MM-estimator", "Rocke S-estimator"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "rpy2>=3.6",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "plotnine>=0.13"]
benchmarks = ["scikit-learn>=1.3", "statsmodels>=0.14"]
# Everything needed to execute the example notebooks end-to-end (tests/test_notebooks.py).
# scipy/matplotlib/plotnine are used by the notebooks, not by the package itself,
# so they are intentionally NOT runtime dependencies.
notebooks = [
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotnine>=0.13",
    "nbclient>=0.9",
    "nbformat>=5",
    "ipykernel>=6",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff",
    "build",
    "twine",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser>=2",
    "sphinx-design",
    "sphinx-copybutton",
    "jinja2",
    "nbformat",
    "nbconvert",
]

[project.urls]
Homepage = "https://github.com/Aakarsh751/robstattm-py"
Documentation = "https://aakarsh751.github.io/robstattm-py/"
Source = "https://github.com/Aakarsh751/robstattm-py"
Issues = "https://github.com/Aakarsh751/robstattm-py/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robstattm_py*"]

[tool.setuptools.package-data]
"robstattm_py" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >5 seconds",
    "needs_pyinit: skipped if pyinit R package missing",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
