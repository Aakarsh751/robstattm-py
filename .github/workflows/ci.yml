name: CI

# RobStatTM-Py test suite. The package wraps R via rpy2, so CI installs R +
# RobStatTM (and deps) on each runner, then runs the strict-tier pytest suite.
# Slow end-to-end notebook execution is skipped here (RPM_SKIP_NOTEBOOKS=1);
# run `python -m pytest tests/` locally for the full set.
#
# NOTE: this workflow assumes `robstatm-py/` is the repository root. If the
# folder lives inside a larger monorepo, move this file to the repo-root
# `.github/workflows/` and add `defaults.run.working-directory: robstatm-py`
# (plus a matching `working-directory` on the checkout-relative steps).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover all three desktop OSes so the rpy2/R bridge is exercised on each.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          # A couple of extra Python versions on Linux (cheapest runner) to
          # guard the >=3.10 floor and a newer interpreter.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # use-public-rspm above configures the correct per-OS binary repo, so we
      # let install.packages() use that default (no hardcoded repos).
      - name: Install core R dependencies
        run: |
          install.packages(c("RobStatTM", "pyinit", "robustbase", "rrcov"))
        shell: Rscript {0}

      # Stretch wrappers (pense / GSE). Installed in a separate, non-fatal step:
      # the external tests skip gracefully when these are absent (needs_pense /
      # needs_gse), so a build failure on these heavier packages must not fail
      # CI — but when they install, their strict-tier tests run.
      - name: Install optional R dependencies (pense, GSE)
        continue-on-error: true
        run: |
          install.packages(c("pense", "GSE"))
        shell: Rscript {0}

      - name: Export R_HOME (Linux/macOS)
        if: runner.os != 'Windows'
        run: echo "R_HOME=$(R RHOME)" >> "$GITHUB_ENV"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (notebooks skipped)
        env:
          RPM_SKIP_NOTEBOOKS: "1"
        run: python -m pytest tests/ -q
